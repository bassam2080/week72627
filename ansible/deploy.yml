
---
- name: Deploy PHP application to EC2 servers
  hosts: webservers
  become: true

  vars:
    image_name: "bassam2080/myapp3:4.1"
    container_name: "myapp-container"

  tasks:

    - name: Install Docker
      ansible.builtin.dnf:
        name: docker
        state: present

    - name: Start Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Pull Docker image
      ansible.builtin.command:
        cmd: "docker pull {{ image_name }}"
      changed_when: true

    - name: Remove old container if present
      ansible.builtin.command:
        argv:
          - docker
          - rm
          - -f
          - "{{ container_name }}"
      register: remove_result
      failed_when: >
        remove_result.rc != 0 and
        'No such container' not in remove_result.stderr

    - name: Run application container
      ansible.builtin.command:
        argv:
          - docker
          - run
          - -d
          - --name
          - "{{ container_name }}"
          - --restart
          - unless-stopped
          - -p
          - "5000:80"
          - "{{ image_name }}"

    - name: Show running containers
      ansible.builtin.command:
        cmd: docker ps
      changed_when: false
