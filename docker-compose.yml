name: myapp

services:
  webphp:
    build: .
    volumes: 
       - ./site:/var/www/html/
    ports:
       - "80:80"

  db:
    image: mysql:9.4
    volumes:
      - ./db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: docker_database





